name: PromoStudio
options:
  bundleIdPrefix: com.jastech
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_HARDENED_RUNTIME: YES
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  PromoStudio:
    type: application
    platform: macOS
    sources:
      - path: PromoStudio
    postBuildScripts:
      - name: Copy Remotion template
        basedOnDependencyAnalysis: false
        script: |
          # Copy the Remotion template into the bundle, excluding node_modules and render output
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/RemotionTemplate"
          mkdir -p "$DEST"
          rsync -a --delete --exclude node_modules --exclude out --exclude 'public/jobs' "$SRCROOT/RemotionTemplate/" "$DEST/"
          # Simulator capture tool (XCUITest) sources
          RUNNER="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/CaptureRunner"
          mkdir -p "$RUNNER"
          rsync -a --delete --exclude 'xcuserdata' --exclude 'build' "$SRCROOT/CaptureRunner/" "$RUNNER/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.PromoStudio
        PRODUCT_NAME: Promo Studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Promo Studio
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSHumanReadableCopyright: "JASTech"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: PromoStudio/Resources/PromoStudio.entitlements
