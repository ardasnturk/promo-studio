name: PromoStudioCaptureRunner
options:
  bundleIdPrefix: com.jastech.PromoStudio.capture
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  RunnerHost:
    type: application
    platform: iOS
    sources: [RunnerHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.PromoStudio.capture.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  CaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CaptureUITests]
    dependencies:
      - target: RunnerHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.PromoStudio.capture.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RunnerHost
schemes:
  CaptureUITests:
    build:
      targets:
        RunnerHost: all
        CaptureUITests: [test]
    test:
      targets: [CaptureUITests]
